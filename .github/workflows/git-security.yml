name: Git Security & Push Protection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-and-gitignore-scan:
    name: Secret & Prohibited File Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Backoffice Git Security & .gitignore Verification
        run: node scripts/git-security-scan.mjs --ci --verify-gitignore

      - name: Run Gitleaks Secret Scan (Workspace & Outgoing Diffs, Redacted)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        with:
          args: --redact --no-banner

  dependency-security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit Backend Dependencies (High/Critical)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Frontend Dependencies (High/Critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

